<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X TRADER AI - Payment Gateway</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Poppins', sans-serif;
      /* X Trader AI wala Dark Background */
      background: radial-gradient(circle at top left, #1a0b2e, #05050a);
      color: #ffffff;
      display: flex; justify-content: center; align-items: center; 
      min-height: 100vh; padding: 20px; 
    }

    .card { 
      background: rgba(15, 23, 42, 0.85); 
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      padding: 40px 25px; 
      border-radius: 20px; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
      text-align: center; 
      max-width: 400px; width: 100%; 
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px; font-weight: 700;
      color: #22d3ee; /* Cyan glow */
      text-shadow: 0 0 15px rgba(34, 211, 238, 0.6);
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 11px; color: #94a3b8; letter-spacing: 1.5px;
      text-transform: uppercase; margin-bottom: 30px;
    }

    .amount-label { font-size: 14px; color: #cbd5e1; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    
    .amount { 
      font-family: 'Orbitron', sans-serif;
      font-size: 52px; font-weight: bold; 
      color: #4ade80; /* Green glow */
      text-shadow: 0 0 25px rgba(74, 222, 128, 0.4);
      margin-bottom: 30px;
    }

    .features {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      margin-bottom: 30px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .features p { font-size: 13px; color: #e2e8f0; margin-bottom: 12px; display: flex; align-items: center; }
    .features p:last-child { margin-bottom: 0; }
    .features span { color: #4ade80; margin-right: 10px; font-weight: bold; font-size: 16px; }

    .btn { 
      background: linear-gradient(90deg, #9333ea, #ec4899); /* Purple to Pink */
      color: #fff; border: none; padding: 16px; 
      font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer; 
      width: 100%; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 5px 15px rgba(236, 72, 153, 0.3);
      display: flex; justify-content: center; align-items: center;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5); }
    .btn:disabled { background: #334155; box-shadow: none; cursor: not-allowed; transform: none; color: #94a3b8; }

    .footer-text {
      font-size: 11px; color: #64748b; margin-top: 25px; line-height: 1.5;
    }

    .error-msg { 
      color: #f87171; font-size: 13px; margin-top: 15px; 
      background: rgba(248, 113, 113, 0.1); padding: 10px; border-radius: 8px;
      border: 1px solid rgba(248, 113, 113, 0.2); display: none; 
    }

    /* Loader Animation */
    .loader {
      border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff;
      border-radius: 50%; width: 18px; height: 18px;
      animation: spin 0.8s linear infinite; display: inline-block; margin-right: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">X TRADER AI</div>
  <div class="subtitle">Secure Membership Activation</div>

  <div class="amount-label">ACTIVATION FEE</div>
  <div class="amount">₹499</div>

  <div class="features">
    <p><span>✓</span> Fixed payment amount: ₹499</p>
    <p><span>✓</span> Unique order for every request</p>
    <p><span>✓</span> Secure payment verification</p>
  </div>

  <!-- Button -->
  <button id="payBtn" class="btn">ACTIVATE HACK</button>
  
  <!-- Error Message Box -->
  <div id="errorMsg" class="error-msg"></div>

  <div class="footer-text">
    Payment status is confirmed directly with the payment gateway.<br>Do not close this page until verification is complete.
  </div>
</div>

<script>
  const payBtn = document.getElementById('payBtn');
  const errorMsg = document.getElementById('errorMsg');

  payBtn.addEventListener('click', async () => {
    // 1. Show Loading on Button
    payBtn.disabled = true;
    payBtn.innerHTML = '<span class="loader"></span> CONNECTING TO GATEWAY...';
    errorMsg.style.display = 'none';

    try {
      // 2. Call Backend to create order
      const res = await fetch('/api/create-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: 499 })
      });

      // 3. Parse JSON safely
      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("Server error. Please try again.");
      }

      if (!res.ok || !data.success) {
        throw new Error(data.error || 'Failed to create order');
      }

      // 4. Get Payment Link from RuPayX
      const paymentLink = data.payment_url || data.qr_code;
      
      if (!paymentLink) {
        throw new Error('No payment link received from gateway.');
      }

      // 5. Redirect directly to the RuPayX payment page!
      payBtn.innerHTML = '<span class="loader"></span> REDIRECTING...';
      window.location.href = paymentLink;

    } catch (error) {
      // Show Error if something fails
      errorMsg.textContent = error.message;
      errorMsg.style.display = 'block';
      
      // Reset Button
      payBtn.disabled = false;
      payBtn.textContent = 'CREATE NEW ₹499 ORDER';
    }
  });
</script>

</body>
</html>
