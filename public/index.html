<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X TRADER AI - Payment</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top left, #1a0b2e, #000000);
      color: #ffffff;
      display: flex; justify-content: center; align-items: center; 
      min-height: 100vh; padding: 20px; 
    }

    .card { 
      background: rgba(15, 23, 42, 0.8); 
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px 25px; 
      border-radius: 20px; 
      box-shadow: 0 15px 40px rgba(0,0,0,0.5); 
      text-align: center; 
      max-width: 420px; width: 100%; 
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px; font-weight: 700;
      color: #22d3ee; /* Cyan glow */
      text-shadow: 0 0 15px rgba(34, 211, 238, 0.6);
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 12px; color: #94a3b8; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 25px;
    }

    .amount-label { font-size: 14px; color: #cbd5e1; margin-bottom: 5px; }
    .amount { 
      font-family: 'Orbitron', sans-serif;
      font-size: 48px; font-weight: bold; 
      color: #4ade80; /* Green glow */
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
      margin-bottom: 25px;
    }

    .features {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 15px;
      text-align: left;
      margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .features p { font-size: 13px; color: #e2e8f0; margin-bottom: 10px; display: flex; align-items: center; }
    .features p:last-child { margin-bottom: 0; }
    .features span { color: #4ade80; margin-right: 10px; font-weight: bold; }

    .btn { 
      background: linear-gradient(90deg, #9333ea, #ec4899); /* Purple to Pink */
      color: #fff; border: none; padding: 16px; 
      font-size: 16px; font-weight: 600; border-radius: 10px; cursor: pointer; 
      width: 100%; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 5px 15px rgba(236, 72, 153, 0.3);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(236, 72, 153, 0.5); }
    .btn:disabled { background: #475569; box-shadow: none; cursor: not-allowed; transform: none; }

    .error-msg { color: #f87171; font-size: 13px; margin-top: 15px; min-height: 20px; }

    /* QR Code Section */
    #qrContainer { display: none; margin-top: 20px; animation: fadeIn 0.5s ease-in-out; }
    .qr-wrapper {
      background: #ffffff; padding: 15px; border-radius: 15px; 
      display: inline-block; margin-bottom: 15px;
    }
    .scan-text { color: #4ade80; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
    .redirect-text { color: #94a3b8; font-size: 12px; margin-top: 10px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Loader */
    .loader {
      border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff;
      border-radius: 50%; width: 20px; height: 20px;
      animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">X TRADER AI</div>
  <div class="subtitle">Secure Membership Activation</div>

  <!-- Initial View -->
  <div id="initialView">
    <div class="amount-label">ACTIVATION FEE</div>
    <div class="amount">₹499</div>

    <div class="features">
      <p><span>✓</span> Fixed payment amount: ₹499</p>
      <p><span>✓</span> Unique order for every request</p>
      <p><span>✓</span> Secure payment verification</p>
    </div>

    <button id="payBtn" class="btn">Create New ₹499 Order</button>
    <div id="errorMsg" class="error-msg"></div>
  </div>

  <!-- QR View -->
  <div id="qrContainer">
    <div class="amount" style="margin-bottom: 10px;">₹499</div>
    <div class="scan-text">Scan to Pay</div>
    <div class="qr-wrapper" id="qrbox"></div>
    <div class="redirect-text">
      <span class="loader" style="width: 12px; height: 12px; border-width: 2px; margin-right: 5px;"></span>
      Redirecting to payment page...
    </div>
  </div>
</div>

<script>
  const payBtn = document.getElementById('payBtn');
  const initialView = document.getElementById('initialView');
  const qrContainer = document.getElementById('qrContainer');
  const qrbox = document.getElementById('qrbox');
  const errorMsg = document.getElementById('errorMsg');

  payBtn.addEventListener('click', async () => {
    // UI Loading State
    payBtn.disabled = true;
    payBtn.innerHTML = '<span class="loader"></span> Processing...';
    errorMsg.textContent = '';

    try {
      // Call Backend API
      const res = await fetch('/api/create-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: 499 })
      });

      // Check if response is valid JSON
      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("Server error. Please try again.");
      }

      if (!res.ok || !data.success) {
        throw new Error(data.error || 'Failed to create order');
      }

      // Get payment link
      const paymentLink = data.payment_url || data.qr_code;
      if (!paymentLink) throw new Error('No payment link received from gateway.');

      // Hide initial view, show QR view
      initialView.style.display = 'none';
      qrContainer.style.display = 'block';

      // Generate QR
      new QRCode(qrbox, { 
        text: paymentLink, 
        width: 180, 
        height: 180,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      // AUTO REDIRECT LOGIC (After 3 seconds, it opens the payment link)
      setTimeout(() => {
        window.location.href = paymentLink;
      }, 3000);

    } catch (error) {
      // Error Handling
      errorMsg.textContent = error.message;
      payBtn.disabled = false;
      payBtn.textContent = 'Create New ₹499 Order';
    }
  });
</script>

</body>
</html>
